name: Validate runner scripts

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck jq
      - name: Check Bash syntax
        run: |
          for script in ./*.sh; do
            bash -n "$script"
          done
      - name: Run ShellCheck
        run: shellcheck --external-sources ./*.sh
      - name: Run hermetic lifecycle regression tests
        run: python3 -m unittest discover -s tests -v
